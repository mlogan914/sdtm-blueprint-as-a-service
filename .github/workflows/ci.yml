name: BaaS CI

on:
  push:
    branches:
      - main
      - odm_adapter
      - scaffold
      - ci
    paths-ignore:
      - "README.md"
      - "**/*.md"

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: odm-2-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        
      - name: Lint Python
        run: |
          ruff check .

      - name: Check Python compile
        run: |
          python -m compileall .

      - name: Check shell scripts
        run: |
          find . -name "*.sh" -exec bash -n {} \;

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          VEXIN_03:
            outputs:
              dev:
                type: duckdb
                path: dev.duckdb
                threads: 1
            target: dev
          EOF

      - name: Validate dbt project
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: dbt parse

      - name: Compile dbt project
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: dbt compile


  integration-test:
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: odm-2-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      
      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          VEXIN_03:
            outputs:
              dev:
                type: duckdb
                path: dev.duckdb
                threads: 1
            target: dev
          EOF

      - name: Load seed data
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: dbt seed

      - name: Run dbt models
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: dbt run

      - name: Run dbt tests
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: dbt test

      - name: Verify integration output
        working-directory: odm-2-0/studies/VEXIN-03/dbt
        run: |
            python - <<'PY'
            import duckdb

            con = duckdb.connect("dev.duckdb")

            row_count = con.execute(
                "select count(*) from dev.dm"
            ).fetchone()[0]

            assert row_count > 0, "DM table is empty"
            print(f"DM validation passed: {row_count} rows")
            PY